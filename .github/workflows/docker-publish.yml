name: Build and push image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - versions.env
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CACHE_SCOPE: horizon-server-build

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lire versions.env
        run: |
          set -a
          # shellcheck disable=SC1091
          source versions.env
          set +a
          echo "HORIZON_GIT_REF=nightly" >> "$GITHUB_ENV"
          echo "IMAGE_REVISION=$IMAGE_REVISION" >> "$GITHUB_ENV"

      - name: SHA du tag nightly (Horizon)
        run: |
          sha=$(git ls-remote https://github.com/horizon-rust/horizon.git refs/tags/nightly | awk '{print $1}')
          [ -n "$sha" ] || { echo "tag nightly introuvable" >&2; exit 1; }
          short=${sha:0:7}
          echo "HORIZON_SOURCE_SHA=$sha" >> "$GITHUB_ENV"
          echo "HORIZON_SOURCE_SHORT=$short" >> "$GITHUB_ENV"
          {
            echo "### Tags image"
            echo "- \`nightly\` — dernier build (pull latest)"
            echo "- \`nightly-${short}\` — Horizon \`${sha}\`"
            echo "- \`nightly-${short}-r${IMAGE_REVISION}\` — immuable (upstream + révision Docker)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly-${{ env.HORIZON_SOURCE_SHORT }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly-${{ env.HORIZON_SOURCE_SHORT }}-r${{ env.IMAGE_REVISION }}
          labels: |
            org.opencontainers.image.version=nightly-${{ env.HORIZON_SOURCE_SHORT }}-r${{ env.IMAGE_REVISION }}
            io.horizon.git-ref=${{ env.HORIZON_GIT_REF }}
            io.horizon.source.sha=${{ env.HORIZON_SOURCE_SHA }}
            io.horizon.source.short=${{ env.HORIZON_SOURCE_SHORT }}
            io.horizon.image.revision=${{ env.IMAGE_REVISION }}
          build-args: |
            HORIZON_GIT_REF=${{ env.HORIZON_GIT_REF }}
            HORIZON_SOURCE_SHA=${{ env.HORIZON_SOURCE_SHA }}
            IMAGE_REVISION=${{ env.IMAGE_REVISION }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
            type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,compression=zstd,oci-mediatypes=true
            type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
