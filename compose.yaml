# Game files: copy horizon-prepare 26.3 output into ./prepared-26.3/ then docker compose up -d

name: horizon-server

services:
  horizon:
    image: ghcr.io/cleboost/horizon-serveur-docker:nightly
    pull_policy: always
    container_name: horizon-server
    restart: unless-stopped
    ports:
      - "25565:25565"
    stop_grace_period: 180s
    volumes:
      - horizon-data:/data
      - ./prepared-26.3:/opt/horizon/.local/horizon-client/26.3:ro
    environment:
      HORIZON_EULA: "true"
      HORIZON_WORLD: world
      HORIZON_PORT: "25565"
      HORIZON_WHITELIST: "true"
      HORIZON_ONLINE: "true"
      # HORIZON_SEED: "12345"
      # HORIZON_PLAYERS: "Steve,Alex"
      # HORIZON_OP: "Steve"
      # HORIZON_MOTD: "My Horizon server"
      # HORIZON_MAX_PLAYERS: "20"
      # HORIZON_PANEL: "true"
      # HORIZON_PANEL_BIND: "0.0.0.0:8130"
      # HORIZON_PANEL_ALLOW_PUBLIC: "true"
      # HORIZON_CONFIG: "properties.spawn-protection=16"

volumes:
  horizon-data:
